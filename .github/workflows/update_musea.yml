name: MuseumPass Maandelijkse Update

on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies installeren
        run: pip install -r requirements.txt

      - name: Playwright Chromium installeren
        run: playwright install chromium --with-deps

      - name: Firebase credentials schrijven
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          if [ -z "$FIREBASE_CREDENTIALS" ]; then
            echo "FOUT: FIREBASE_CREDENTIALS secret is niet ingesteld."
            exit 1
          fi
          printf '%s' "$FIREBASE_CREDENTIALS" > /tmp/firebase-credentials.json

      - name: Musea updaten
        id: update
        run: python update_musea.py --credentials /tmp/firebase-credentials.json

      - name: WhatsApp-bericht sturen via CallMeBot
        if: always()
        env:
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
        run: |
          if [ -z "$CALLMEBOT_API_KEY" ]; then
            echo "CALLMEBOT_API_KEY niet ingesteld, WhatsApp-bericht overgeslagen."
            exit 0
          fi
          if [ -f /tmp/museum_update_summary.json ]; then
            TOTAAL=$(python3 -c "import json; d=json.load(open('/tmp/museum_update_summary.json')); print(d['totaal_gescraped'])")
            BIJGEWERKT=$(python3 -c "import json; d=json.load(open('/tmp/museum_update_summary.json')); print(d['bijgewerkt'])")
            NIEUW=$(python3 -c "import json; d=json.load(open('/tmp/museum_update_summary.json')); print(d['nieuw'])")
            FOUTEN=$(python3 -c "import json; d=json.load(open('/tmp/museum_update_summary.json')); print(d['scrape_fouten'] + d['schrijf_fouten'])")
            BERICHT="MuseumPass update klaar! Gescraped: ${TOTAAL}, Bijgewerkt: ${BIJGEWERKT}, Nieuw: ${NIEUW}, Fouten: ${FOUTEN}"
          else
            STATUS="${{ steps.update.outcome }}"
            BERICHT="MuseumPass update mislukt (status: ${STATUS}). Controleer de GitHub Actions logs."
          fi
          ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${BERICHT}'))")
          curl -s "https://api.callmebot.com/whatsapp.php?phone=32499712300&text=${ENCODED}&apikey=${CALLMEBOT_API_KEY}" || true

      - name: Credentials verwijderen
        if: always()
        run: rm -f /tmp/firebase-credentials.json
